name: Build MW Real Rumble

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mw-real-rumble
    paths:
      - 'src/**'
      - 'data/**'
      - '.github/workflows/build-mw-real-rumble.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'data/**'
      - '.github/workflows/build-mw-real-rumble.yml'

jobs:
  build-mw:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release-MW Win32
        shell: cmd
        run: >-
          msbuild src\NFS_XtendedInput.vcxproj /m
          /p:Configuration=Release-MW
          /p:Platform=Win32
          /p:PostBuildEventUseInBuild=false

      - name: Verify ASI
        shell: pwsh
        run: |
          if (!(Test-Path 'src/Release-MW/NFS_XtendedInput.asi')) {
            throw 'NFS_XtendedInput.asi was not produced.'
          }
          Get-Item 'src/Release-MW/NFS_XtendedInput.asi' | Format-List FullName,Length,LastWriteTime

      - name: Build full MW package
        shell: cmd
        run: call data\post-build\HasTPK-MW.bat Release MW

      - name: Verify package
        shell: pwsh
        run: |
          $pkg = '.Release Packages/Release-MW'
          $required = @(
            "$pkg/scripts/NFS_XtendedInput.asi",
            "$pkg/scripts/NFS_XtendedInput.ini",
            "$pkg/scripts/NFS_XtendedInput.default.ini",
            "$pkg/scripts/nfs_cursor.cur",
            "$pkg/GLOBAL/XtendedInputButtons.tpk",
            "$pkg/EventReference.txt",
            "$pkg/README.md"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing package file: $file" }
          }
          Get-ChildItem $pkg -Recurse | Select-Object FullName,Length

      - name: Upload full MW package
        uses: actions/upload-artifact@v4
        with:
          name: NFS-XtendedInput-MW-RealRumble-Full-Package
          path: '.Release Packages/Release-MW/**'
          if-no-files-found: error
